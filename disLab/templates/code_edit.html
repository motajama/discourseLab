{% extends "base.html" %}

{% block content %}
<section class="page-header">
    <p class="eyebrow">Open code</p>
    <h1>Edit Code</h1>
    <p>Active project: {{ active_project.name }}</p>
</section>

<section class="detail-actions">
    <a class="button-secondary" href="{{ url_for('codes') }}">Back to Codes</a>
</section>

<section class="info-panel">
    <h2>{{ code.name }}</h2>
    <form class="document-form" action="{{ url_for('update_code', code_id=code.id) }}" method="post">
        <div class="form-grid">
            <label>
                <span>Name</span>
                <input type="text" name="name" value="{{ code.name }}" required>
            </label>
            <label>
                <span>Color</span>
                <input type="color" name="color" value="{{ code.color }}">
            </label>
        </div>
        <label>
            <span>Description</span>
            <textarea name="description" rows="5">{{ code.description or "" }}</textarea>
        </label>
        <button type="submit" class="button-primary">Save code</button>
    </form>
</section>
{% endblock %}
